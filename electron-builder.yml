appId: dev.orse.editor
productName: OR Save Editor
copyright: Fan-made tool. The Elder Scrolls IV Oblivion Remastered and its assets are © Bethesda Softworks.
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: resources/game
    to: game
  - from: resources/wasm
    to: wasm
asar: true
win:
  icon: build/icon.ico
  target:
    - target: portable
      arch: [x64]
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
portable:
  artifactName: ${productName}-${version}-portable.exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: ${productName}-${version}-setup.exe
linux:
  icon: build/icon.png
  category: Game
  synopsis: Save editor for Oblivion Remastered
  description: Edit level, attributes, skills, gold, inventory (with the real item icons), spells, factions, bounty and game globals of an Oblivion Remastered save. Works on SteamOS / Steam Deck.
  executableName: or-save-editor
  target:
    - target: AppImage
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
appImage:
  artifactName: OR-Save-Editor-${version}-x86_64.AppImage
